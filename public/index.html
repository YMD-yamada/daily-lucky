<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Daily Lucky｜今日のラッキーカラー</title>
    <meta name="description" content="星座を選ぶだけで、今日の運勢とラッキーカラー・ラッキーアイテムが1分でわかります。登録なし・無料。" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#fff7ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1712" media="(prefers-color-scheme: dark)" />
    <style>
      /* 朝の通勤中に1分で読む。1画面1枚のカードだけを見せる */
      :root {
        --bg: #fff7ec;
        --surface: #ffffff;
        --fg: #2b241c;
        --muted: #7a6c5c;
        --line: #eadfcf;
        --accent: #d9622b;
        --accent-fg: #ffffff;
        --soft: #fbeedd;
        --font: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1712;
          --surface: #25211a;
          --fg: #f3ebe0;
          --muted: #b3a593;
          --line: #3a332a;
          --accent: #f08a55;
          --accent-fg: #1a1712;
          --soft: #2f2920;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: var(--font);
        background: var(--bg);
        color: var(--fg);
        line-height: 1.7;
      }
      .wrap {
        max-width: 460px;
        margin: 0 auto;
        padding: 20px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      h1 { margin: 0; font-size: 1.15rem; letter-spacing: 0.02em; }
      .date { color: var(--muted); font-size: 0.9rem; }
      h2 { margin: 0; font-size: 1.25rem; }
      p { margin: 0; }
      .muted { color: var(--muted); font-size: 0.85rem; }
      button, .btn {
        font: inherit;
        cursor: pointer;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--fg);
        padding: 12px 14px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 48px;
      }
      button:focus-visible, .btn:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      .btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
      .link-btn { border: 0; background: none; color: var(--muted); text-decoration: underline; min-height: 40px; padding: 8px; }

      /* 星座えらび */
      .signs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .sign { flex-direction: column; gap: 0; padding: 10px 4px; }
      .sign .sym { font-size: 1.6rem; line-height: 1.2; }
      .sign .nm { font-weight: 700; font-size: 0.95rem; }
      .sign .rg { color: var(--muted); font-size: 0.72rem; }

      /* 結果カード */
      .card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
      .band { padding: 22px 20px 18px; color: #fff; display: flex; flex-direction: column; gap: 2px; }
      .band .lbl { font-size: 0.8rem; opacity: 0.9; letter-spacing: 0.08em; }
      .band .color { font-size: 2rem; font-weight: 800; line-height: 1.3; }
      .band.light-text { color: #2b241c; }
      .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
      .who { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .rank { font-weight: 700; }
      .rank b { font-size: 1.4rem; color: var(--accent); }
      .stars { letter-spacing: 2px; color: var(--accent); font-size: 1.05rem; }
      .msg { font-size: 1.05rem; }
      .item { display: flex; gap: 12px; align-items: center; background: var(--soft); border-radius: 16px; padding: 12px; }
      .item img { width: 48px; height: 48px; flex: none; }
      .item .lbl { font-size: 0.78rem; color: var(--muted); }
      .item .nm { font-weight: 700; font-size: 1.1rem; }
      .shop { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .note { font-size: 0.75rem; color: var(--muted); }
      .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

      /* ほかの星座 */
      .ranking { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      .ranking li { display: grid; grid-template-columns: 2.6em 1fr auto; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
      .ranking .no { font-weight: 800; color: var(--accent); }
      .ranking .chip { font-size: 0.8rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
      .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid var(--line); }

      .tip { background: var(--soft); border-radius: 14px; padding: 12px 14px; font-size: 0.88rem; }
      .loading { text-align: center; padding: 40px 0; color: var(--muted); }
      .error { background: var(--soft); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
      footer { display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; margin-top: 8px; }
      footer nav { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 0.85rem; }
      footer a { color: var(--muted); }
      [hidden] { display: none !important; }
      @media (prefers-reduced-motion: no-preference) {
        .card { animation: rise 0.35s ease-out; }
        @keyframes rise { from { transform: translateY(8px); opacity: 0.4; } to { transform: none; opacity: 1; } }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1>Daily Lucky</h1>
        <span class="date" id="today"></span>
      </header>

      <!-- 初回だけ：星座を選ぶ -->
      <section id="picker" hidden aria-labelledby="pickerTitle">
        <div style="display: flex; flex-direction: column; gap: 12px">
          <h2 id="pickerTitle">あなたの星座は？</h2>
          <p class="muted">選ぶのは最初の1回だけ。次からは開くとすぐ今日の運勢が出ます。</p>
          <div class="signs" id="signGrid"></div>
        </div>
      </section>

      <!-- 今日の結果 -->
      <section id="result" hidden aria-live="polite"></section>

      <div id="loading" class="loading" hidden>今日の運勢を読み込み中…<br /><span class="muted">しばらく使われていないと、最初だけ30秒ほどかかります</span></div>

      <div id="error" class="error" hidden>
        <p>読み込めませんでした。電波のよいところで、もう一度お試しください。</p>
        <button type="button" id="retryBtn" class="btn-primary">もう一度読み込む</button>
      </div>

      <section id="others" hidden aria-labelledby="othersTitle" style="display: flex; flex-direction: column; gap: 10px">
        <h2 id="othersTitle" style="font-size: 1.05rem">今日の12星座ランキング</h2>
        <ol class="ranking" id="ranking"></ol>
      </section>

      <p class="tip" id="tip" hidden>📌 ブラウザのメニューから「ホーム画面に追加」すると、毎朝ワンタップで見られます。</p>

      <footer>
        <p class="muted" id="credit" hidden>
          占いデータ：<a href="http://jugemkey.jp/api/waf/api_free.php" target="_blank" rel="noopener">JugemKey</a>・<a href="http://www.tarim.co.jp/" target="_blank" rel="noopener">原宿占い館 塔里木</a>
        </p>
        <p class="muted">登録なし・無料。星座はこの端末の中だけに保存します。</p>
        <nav aria-label="このアプリについて">
          <a href="https://ymd-portfolio-site.pages.dev/legal/privacy" rel="noopener">プライバシー</a>
          <a href="https://ymd-portfolio-site.pages.dev/legal/terms" rel="noopener">利用規約</a>
          <a href="https://ymd-portfolio-site.pages.dev/legal/support" rel="noopener">お問い合わせ</a>
          <a href="https://ko-fi.com/ymdapps" target="_blank" rel="noopener noreferrer">応援する（Ko-fi）</a>
        </nav>
      </footer>
    </main>

    <script>
      const SIGNS = [
        { name: "牡羊座", sym: "♈", range: "3/21〜4/19" },
        { name: "牡牛座", sym: "♉", range: "4/20〜5/20" },
        { name: "双子座", sym: "♊", range: "5/21〜6/21" },
        { name: "蟹座", sym: "♋", range: "6/22〜7/22" },
        { name: "獅子座", sym: "♌", range: "7/23〜8/22" },
        { name: "乙女座", sym: "♍", range: "8/23〜9/22" },
        { name: "天秤座", sym: "♎", range: "9/23〜10/23" },
        { name: "蠍座", sym: "♏", range: "10/24〜11/22" },
        { name: "射手座", sym: "♐", range: "11/23〜12/21" },
        { name: "山羊座", sym: "♑", range: "12/22〜1/19" },
        { name: "水瓶座", sym: "♒", range: "1/20〜2/18" },
        { name: "魚座", sym: "♓", range: "2/19〜3/20" },
      ];
      const signKey = "daily-lucky-sign";
      const legacyKey = "daily-lucky-profile-v2";
      const $ = (id) => document.getElementById(id);

      function escapeHtml(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }
      function safeUrl(u) {
        return /^https:\/\//.test(u || "") ? u : "#";
      }
      function loadSign() {
        try {
          const s = localStorage.getItem(signKey);
          if (s) return s;
          const legacy = JSON.parse(localStorage.getItem(legacyKey) || "{}");
          return legacy.favoriteSign || "";
        } catch {
          return "";
        }
      }
      function saveSign(name) {
        try {
          localStorage.setItem(signKey, name);
        } catch {}
      }
      // 背景色が明るいときは文字を濃くする
      function isLight(hex) {
        const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
        if (!m) return false;
        const n = parseInt(m[1], 16);
        const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
        return 0.299 * r + 0.587 * g + 0.114 * b > 170;
      }
      // 順位から5段階の星にする（1〜2位=5、12位=1）
      function starCount(rank) {
        const r = Number(rank) || 6;
        return r <= 2 ? 5 : r <= 5 ? 4 : r <= 8 ? 3 : r <= 11 ? 2 : 1;
      }
      function stars(rank) {
        const n = starCount(rank);
        return "★".repeat(n) + "☆".repeat(5 - n);
      }
      function shopLinks(row) {
        const rakuten = row.storeMode === "rakuten" ? row.productUrl : row.altLinks?.rakuten;
        const amazon = row.storeMode === "amazon" ? row.productUrl : row.altLinks?.amazon;
        return { rakuten: safeUrl(rakuten), amazon: safeUrl(amazon) };
      }

      const now = new Date();
      $("today").textContent = `${now.getMonth() + 1}月${now.getDate()}日（${"日月火水木金土"[now.getDay()]}）`;

      $("signGrid").innerHTML = SIGNS.map(
        (s) => `<button type="button" class="sign" data-sign="${s.name}">
          <span class="sym" aria-hidden="true">${s.sym}</span><span class="nm">${s.name}</span><span class="rg">${s.range}</span>
        </button>`
      ).join("");
      $("signGrid").addEventListener("click", (e) => {
        const b = e.target.closest("[data-sign]");
        if (!b) return;
        saveSign(b.dataset.sign);
        show();
      });

      function renderResult(row) {
        const light = isLight(row.colorHex);
        const links = shopLinks(row);
        $("result").innerHTML = `
          <article class="card">
            <div class="band${light ? " light-text" : ""}" style="background:${escapeHtml(row.colorHex || "#d9622b")}">
              <span class="lbl">今日のラッキーカラー</span>
              <span class="color">${escapeHtml(row.color)}</span>
            </div>
            <div class="body">
              <div class="who">
                <span class="rank">${escapeHtml(row.sign)}　<b>${row.rank}</b> 位 <span class="muted">/ 12星座</span></span>
                <span class="stars" role="img" aria-label="運勢 5段階中 ${starCount(row.rank)}">${stars(row.rank)}</span>
              </div>
              <p class="msg">${escapeHtml(row.content)}</p>
              <div class="item">
                <img src="${escapeHtml(safeUrl(row.imageUrl))}" alt="" loading="lazy" onerror="this.hidden=true" />
                <div><div class="lbl">ラッキーアイテム</div><div class="nm">${escapeHtml(row.item)}</div></div>
              </div>
              <div class="shop">
                <a class="btn" data-shop="rakuten" href="${escapeHtml(links.rakuten)}" target="_blank" rel="noopener noreferrer sponsored">楽天で見る</a>
                <a class="btn" data-shop="amazon" href="${escapeHtml(links.amazon)}" target="_blank" rel="noopener noreferrer sponsored">Amazonで見る</a>
              </div>
              <p class="note">お店のページが開きます。購入されると紹介料を受け取る場合があります。</p>
            </div>
          </article>
          <div class="row" style="margin-top:10px">
            <button type="button" class="link-btn" id="changeSign">星座を変える</button>
            <button type="button" class="link-btn" id="toggleOthers">ほかの星座も見る</button>
          </div>`;
        $("changeSign").addEventListener("click", () => {
          $("result").hidden = true;
          $("others").hidden = true;
          $("picker").hidden = false;
          window.scrollTo(0, 0);
        });
        $("toggleOthers").addEventListener("click", () => {
          $("others").hidden = !$("others").hidden;
          if (!$("others").hidden) $("others").scrollIntoView({ behavior: "smooth", block: "start" });
        });
        $("result").querySelectorAll("[data-shop]").forEach((a) => {
          const payload = JSON.stringify({ productId: row.productId, keywordKey: row.keywordKey, productName: row.name, store: a.dataset.shop });
          a.addEventListener("click", () => {
            fetch("/api/click", { method: "POST", headers: { "Content-Type": "application/json" }, body: payload }).catch(() => {});
          });
        });
        fetch("/api/impression", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ productId: row.productId, keywordKey: row.keywordKey }),
        }).catch(() => {});
      }

      function renderRanking(list, mine) {
        $("ranking").innerHTML = list
          .map(
            (r) => `<li${r.sign === mine ? ' aria-current="true" style="border-color:var(--accent)"' : ""}>
              <span class="no">${r.rank}位</span><span>${escapeHtml(r.sign)}</span>
              <span class="chip"><i class="dot" style="background:${escapeHtml(r.colorHex || "#ccc")}"></i>${escapeHtml(r.color)}</span>
            </li>`
          )
          .join("");
      }

      async function show() {
        const sign = loadSign();
        $("error").hidden = true;
        if (!SIGNS.some((s) => s.name === sign)) {
          $("picker").hidden = false;
          $("result").hidden = true;
          return;
        }
        $("picker").hidden = true;
        $("loading").hidden = false;
        try {
          const res = await fetch("/api/today");
          if (!res.ok) throw new Error(String(res.status));
          const json = await res.json();
          const list = Array.isArray(json.data) ? json.data : [];
          const row = list.find((r) => r.sign === sign);
          if (!row) throw new Error("no data");
          renderResult(row);
          renderRanking(list, sign);
          $("result").hidden = false;
          $("tip").hidden = window.matchMedia("(display-mode: standalone)").matches;
          $("credit").hidden = !(row.sourcesUsed || []).includes("api");
        } catch {
          $("error").hidden = false;
        } finally {
          $("loading").hidden = true;
        }
      }

      $("retryBtn").addEventListener("click", show);
      show();
    </script>
  </body>
</html>
